name: Deploy test app to GitHub Pages

on:
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: github-pages-test
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out test version
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test allocations and Excel exports
        run: npm test
      - name: Build app
        run: npm run build
      - name: Install browser for functional tests
        run: npx playwright install --with-deps chromium
      - name: Test production app at GitHub Pages path
        env:
          PLAYWRIGHT_APP_PATH: /Workhours-IT/
          PLAYWRIGHT_SERVER_COMMAND: npm run preview -- --base=/Workhours-IT/ --port 5174 --strictPort
        run: npm run test:e2e
      - name: Check Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload built website only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/test'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy test website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
